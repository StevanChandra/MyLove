<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Animasi Partikel Hati & Kata Romantis 3D (Mobile Fit)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #000000; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none; /* Mencegah gulingan/zoom bawaan HP saat menggeser canvas */
    }
    
    svg {
      display: none;
    }
    
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* CSS Elemen Teks Romantis (Responsive) */
    #romantic-text {
      position: absolute;
      z-index: 10;
      color: #ffffff;
      font-size: clamp(1.4rem, 5vw, 2.5rem); /* Otomatis menyesuaikan lebar layar */
      font-weight: 300;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493, 0 0 30px #ff1493;
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      padding: 0 15px;
      width: 100%;
    }
  </style>
  
  <!-- Import Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- Teks Romantis -->
  <div id="romantic-text">I Love You ❤️</div>

  <!-- Jalur SVG tersembunyi -->
  <svg viewBox="0 0 600 522">
    <path id="svg-path" d="M300,150 C300,70 200,20 120,70 C40,120 40,220 120,300 C200,380 300,450 300,450 C300,450 400,380 480,300 C560,220 560,120 480,70 C400,20 300,70 300,150 Z" />
  </svg>

  <script>
    // --- 1. SETUP THREE.JS SCENE, CAMERA, RENDERER & CONTROLS ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- FUNGSI MENGATUR POSISI KAMERA SESUAI UKURAN LAYAR ---
    function adjustCameraForMobile() {
      const aspect = window.innerWidth / window.innerHeight;
      
      // Jika mode portrait (HP), undurkan jarak kamera agar bentuk hati tidak terpotong
      if (aspect < 1) {
        camera.position.set(0, 0, 500 / aspect); 
      } else {
        camera.position.set(0, 0, 500);
      }
    }
    adjustCameraForMobile(); // Jalankan saat pertama dimuat

    // --- 2. EKSTRAKSI PATH SVG & PERSIAPAN PARTIKEL ---
    const path = document.querySelector("#svg-path");
    const romanticText = document.querySelector("#romantic-text");
    const length = path.getTotalLength();
    
    const positions = [];
    const targets = [];
    
    // Sesuaikan kerapatan partikel di mobile agar performa lancar
    const isMobile = window.innerWidth < 768;
    const step = isMobile ? 0.45 : 0.3; 

    const svgWidth = 600;
    const svgHeight = 522;

    const mainTimeline = gsap.timeline({
      repeat: -1,
      yoyo: true,
      repeatDelay: 4 
    });

    const particleTimeline = gsap.timeline();

    for (let i = 0; i < length; i += step) {
      const point = path.getPointAtLength(i);
      
      const targetX = point.x - (svgWidth / 2) + (Math.random() - 0.5) * 20;
      const targetY = -point.y + (svgHeight / 2) + (Math.random() - 0.5) * 20;
      const targetZ = (Math.random() - 0.5) * 60;

      const originX = 0;
      const originY = 0;
      const originZ = 0;

      positions.push(originX, originY, originZ);

      const particleVector = { x: originX, y: originY, z: originZ };
      targets.push(particleVector);

      particleTimeline.to(particleVector, {
        x: targetX,
        y: targetY,
        z: targetZ,
        ease: "power2.out",
        duration: 2.5
      }, i * 0.0015);
    }

    mainTimeline.add(particleTimeline);

    // Animasi Teks Romantis
    mainTimeline.to(romanticText, {
      opacity: 1,
      scale: 1,
      duration: 1.2,
      ease: "back.out(1.7)"
    }, ">-0.5");

    // --- 3. GEOMETRI DAN MATERIAL PARTIKEL ---
    const geometry = new THREE.BufferGeometry();
    const positionAttribute = new THREE.Float32BufferAttribute(positions, 3);
    geometry.setAttribute('position', positionAttribute);

    const material = new THREE.PointsMaterial({
      color: 0xff69b4,
      size: isMobile ? 2.8 : 2.2, // Partikel sedikit lebih besar di layar kecil agar terlihat jelas
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    let isFormed = false;

    mainTimeline.eventCallback("onUpdate", () => {
      if (mainTimeline.progress() > 0.8 && !isFormed) {
        isFormed = true;
      } else if (mainTimeline.progress() <= 0.8 && isFormed) {
        isFormed = false;
      }
    });

    // --- 4. RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      const positionArray = geometry.attributes.position.array;
      
      for (let i = 0; i < targets.length; i++) {
        const index = i * 3;
        positionArray[index]     = targets[i].x;
        positionArray[index + 1] = targets[i].y;
        positionArray[index + 2] = targets[i].z;
      }
      
      geometry.attributes.position.needsUpdate = true;
      
      if (isFormed) {
        particles.rotation.y += 0.008;
      } else {
        particles.rotation.y = 0; 
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- RESPONSIVE EVENT HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      
      adjustCameraForMobile(); // Perbarui jarak kamera saat rotasi layar HP
      
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
